<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James Ehrle ePortfolio</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      
      .banner {
        position: relative;
        overflow: hidden;
        box-sizing: border-box;
        min-height: 420px;
        padding: 80px 8%;
      
        display: flex;
        align-items: center;
      
        background:
          radial-gradient(
            circle at top right,
            rgba(45, 212, 191, 0.18),
            transparent 55%
          ),
          #101c2e;
      
        color: #f4f7fb;
        border-bottom: 5px solid #2dd4bf;
      }
      
      /* Keeps the text above the decorative code symbol */
      .bannerText {
        position: relative;
        z-index: 1;
        max-width: 750px;
      }
      
      .banner .bannerLabel {
        margin: 0 0 20px;
        color: #2dd4bf;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 3px;
      }
      
      .banner h1 {
        margin: 0;
        font-size: clamp(42px, 6vw, 76px);
        font-weight: bold;
        line-height: 1.1;
        letter-spacing: -2px;
      }
      
      .accent {
        color: #2dd4bf;
      }
      
      .banner .bannerSubtitle {
        margin: 24px 0 32px;
        color: #c5d1df;
        font-size: 20px;
        line-height: 1.6;
      }
      
      .githubButton {
        display: inline-block;
        padding: 14px 24px;
        border: 2px solid #2dd4bf;
        border-radius: 8px;
      
        color: #2dd4bf;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
      }
      
      .githubButton:hover {
        background-color: #2dd4bf;
        color: #101c2e;
      }
      
      .githubButton:focus-visible {
        outline: 3px solid white;
        outline-offset: 5px;
      }
      
      @media (max-width: 600px) {
        .banner {
          min-height: 360px;
          padding: 55px 25px;
        }
      
        .banner .bannerLabel {
          font-size: 12px;
          letter-spacing: 2px;
        }
      
        .banner .bannerSubtitle {
          font-size: 18px;
        }
      
        .codeAccent {
          font-size: 150px;
          right: -20px;
        }
      }
      
      /* Adds space around the main page content */
      main {
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <header class="banner">
      <div class="bannerText">
        <p class="bannerLabel">CS499 • COMPUTER SCIENCE CAPSTONE</p>
        <h1>James Ehrle<span class="accent">.</span></h1>
        <p class="bannerSubtitle">
          Solving problems. Building skills. Creating solutions.
        </p>
    
        <a class="githubButton" href="https://github.com/James5275">
          Explore My GitHub &rarr;
        </a>
      </div>
    
      <div class="codeAccent" aria-hidden="true">&lt;/&gt;</div>
    </header>

    <main>
      <h2>Welcome to My Portfolio</h2>
      <p>This is my portfolio.</p>
    </main>
  </body>
</html>
